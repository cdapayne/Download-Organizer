<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Download Category</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dialog-body">
  <div class="dialog-container">
    <header class="dialog-header">
      <img src="icons/icon48.png" alt="Download Organizer" class="dialog-logo" />
      <div>
        <h1 class="dialog-title">Save to Category</h1>
        <p class="dialog-subtitle" id="filenameDisplay"></p>
      </div>
    </header>

    <section class="section">
      <label class="section-label">Select an existing category</label>
      <div id="categoryList" class="category-list"></div>
    </section>

    <section class="section">
      <label class="section-label" for="newCategoryInput">Or create a new category</label>
      <div class="input-row">
        <input
          type="text"
          id="newCategoryInput"
          class="text-input"
          placeholder="e.g. Research, Music, Work…"
          maxlength="60"
          autocomplete="off"
        />
        <button id="addCategoryBtn" class="btn btn-secondary">Add</button>
      </div>
    </section>

    <footer class="dialog-footer">
      <button id="skipBtn" class="btn btn-ghost">Skip (use default)</button>
      <button id="saveBtn" class="btn btn-primary" disabled>Save to Category</button>
    </footer>
  </div>

  <script src="dialog.js"></script>
</body>
</html>
